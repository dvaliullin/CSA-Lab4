[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab4-risc-mc"
version = "0.1.0"
dependencies = [
    "pytest>=7.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_format = "%(levelname)-7s %(name)s:%(funcName)-10s %(message)s"
log_level = "DEBUG"

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true